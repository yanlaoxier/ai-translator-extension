name: Secret Scan

# 每次推送 / PR 都扫一遍，防止 API Key 被误提交进仓库。
# 扫描逻辑见 .github/scripts/secret-scan.sh（可本地运行）。

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

# 最小权限：只需要读取代码
permissions:
  contents: read

# 同一分支的重复触发自动取消，节省额度
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: 扫描泄露的 API Key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库（含完整历史）
        uses: actions/checkout@v4
        with:
          # 必须为 0，否则拿不到完整 git 历史，无法扫描历史提交
          fetch-depth: 0

      - name: 运行密钥扫描
        run: bash .github/scripts/secret-scan.sh
