<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课利译 · 管理台</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="desk">
      <aside class="rail">
        <div class="brand">
          <div class="seal" aria-hidden="true">课</div>
          <div>
            <strong>课利译</strong>
            <em>管理台</em>
          </div>
        </div>
        <nav>
          <button type="button" class="nav-btn active" data-view="access">接入</button>
          <button type="button" class="nav-btn" data-view="language">语言</button>
          <button type="button" class="nav-btn" data-view="history">历史</button>
          <button type="button" class="nav-btn" data-view="usage">用量</button>
        </nav>
        <p class="rail-note">OpenAI 协议 · 本地保存</p>
      </aside>

      <main>
        <header class="top">
          <div>
            <p class="eyebrow">阅读账本</p>
            <h1 id="view-title">模型接入</h1>
          </div>
          <span id="status-pill" class="pill">未连接</span>
        </header>

        <section id="view-access" class="view">
          <article class="card">
            <div class="card-head">
              <h2>接口凭证</h2>
              <span>只保存在本机浏览器</span>
            </div>
            <label class="field">
              <span>API Key</span>
              <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" />
            </label>
            <label class="field">
              <span>Base URL</span>
              <input id="baseUrl" type="url" placeholder="https://api.deepseek.com" />
            </label>
            <label class="field">
              <span>模型</span>
              <input id="model" type="text" placeholder="deepseek-v4-flash" />
            </label>
            <div class="row">
              <button type="button" class="btn primary" id="btn-save">保存设置</button>
              <button type="button" class="btn ghost" id="btn-test">测试连接</button>
            </div>
          </article>
        </section>

        <section id="view-language" class="view" hidden>
          <article class="card">
            <div class="card-head">
              <h2>语言方向</h2>
              <span>全页翻译、划词与总结都会使用这里的方向</span>
            </div>
            <div class="ferry" aria-label="翻译方向">
              <label class="stamp">
                <span>原语言</span>
                <select id="sourceLang"></select>
              </label>
              <button type="button" class="swap" id="btn-swap" title="对调语言">⇄</button>
              <label class="stamp">
                <span>目标语言</span>
                <select id="targetLang"></select>
              </label>
            </div>
            <label class="check">
              <input type="checkbox" id="bilingual" checked />
              <span>对照显示原文与译文</span>
            </label>
            <button type="button" class="btn primary" id="btn-lang-save">保存语言</button>
          </article>
        </section>

        <section id="view-history" class="view" hidden>
          <article class="card">
            <div class="card-head">
              <h2>翻译记录</h2>
              <div class="tools">
                <select id="history-filter">
                  <option value="all">全部</option>
                  <option value="selection">划词</option>
                  <option value="page">整页</option>
                  <option value="summary">总结</option>
                </select>
                <button type="button" class="btn ghost" id="btn-clear-history">清空记录</button>
              </div>
            </div>
            <div id="history-list" class="ledger"></div>
          </article>
        </section>

        <section id="view-usage" class="view" hidden>
          <article class="card">
            <div class="card-head">
              <h2>Token 账本</h2>
              <button type="button" class="btn ghost" id="btn-reset-usage">清零统计</button>
            </div>
            <div class="metrics">
              <div class="metric">
                <small>累计消耗</small>
                <strong id="stat-total">0</strong>
              </div>
              <div class="metric">
                <small>输入 Token</small>
                <strong id="stat-prompt">0</strong>
              </div>
              <div class="metric">
                <small>输出 Token</small>
                <strong id="stat-completion">0</strong>
              </div>
              <div class="metric">
                <small>请求次数</small>
                <strong id="stat-requests">0</strong>
              </div>
            </div>
            <p class="chart-label">近 7 日</p>
            <div id="usage-chart" class="bars"></div>
          </article>
        </section>

        <div id="toast" class="toast" hidden></div>
      </main>
    </div>
    <script src="../lib/storage.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
