<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课利译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="mast">
        <div class="seal" aria-hidden="true">课</div>
        <div class="brand">
          <h1>课利译</h1>
          <p>划词即译 · 读完一页</p>
        </div>
        <span id="conn-pill" class="pill">未连接</span>
      </header>

      <section class="lang" aria-label="目标语言">
        <button type="button" class="lang-btn" data-lang="zh" id="lang-zh">译为中文</button>
        <button type="button" class="lang-btn" data-lang="en" id="lang-en">译为英文</button>
      </section>

      <section class="actions">
        <button type="button" class="btn primary" id="btn-translate">翻译本页</button>
        <button type="button" class="btn ghost" id="btn-restore">还原原文</button>
        <button type="button" class="btn sea" id="btn-summary">网页总结</button>
      </section>

      <label class="check">
        <input type="checkbox" id="bilingual" checked />
        <span>对照显示原文与译文</span>
      </label>

      <p class="hint">在网页划选文字可弹出译词条，快捷键 <kbd>Alt</kbd>+<kbd>T</kbd>。</p>
      <button type="button" class="btn link" id="btn-panel">打开管理面板</button>

      <section class="panel">
        <div class="panel-head">
          <h2>模型接入</h2>
          <span>OpenAI 协议</span>
        </div>
        <label class="field">
          <span>API Key</span>
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" />
        </label>
        <label class="field">
          <span>Base URL</span>
          <input id="baseUrl" type="url" placeholder="https://api.deepseek.com" />
        </label>
        <label class="field">
          <span>模型</span>
          <input id="model" type="text" placeholder="deepseek-v4-flash" />
        </label>
        <div class="row">
          <button type="button" class="btn primary wide" id="btn-save">保存设置</button>
          <button type="button" class="btn ghost" id="btn-test">测试连接</button>
        </div>
      </section>

      <div id="toast" class="toast" hidden></div>
    </div>
    <script src="../lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
